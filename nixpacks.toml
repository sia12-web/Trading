# Include devDependencies during install — Next.js production build needs typescript.
# Node 22+: required by @supabase/supabase-js (20 and below deprecated).
[variables]
NIXPACKS_NODE_VERSION = "22"

# Python is only here for scripts/databento_live_sidecar.py, which holds the CME Globex
# live session. Without it the desk silently falls back to a slower quote source.
[phases.setup]
aptPkgs = ["python3", "python3-venv"]

[phases.install]
cmds = [
  "npm ci",
  "python3 -m venv /opt/venv && /opt/venv/bin/pip install --no-cache-dir -r scripts/requirements-sidecar.txt",
]
